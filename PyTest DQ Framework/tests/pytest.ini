[pytest]
markers =
	parquet_data: data quality checks for Parquet datasets
	smoke: basic dataset availability check
	example: framework example tests
	facility_name_min_time_spent_per_visit_date: checks for the facility-name duration dataset
	facility_type_avg_time_spent_per_visit_date: checks for the facility-type duration dataset
	patient_sum_treatment_cost_per_facility_type: checks for the patient treatment-cost dataset
